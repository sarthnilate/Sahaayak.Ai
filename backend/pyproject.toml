[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sahaayak-ai-backend"
version = "0.1.0"
description = "Sahaayak AI Backend - AI-assisted community incident-intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "python-multipart==0.0.20",
    "google-genai>=1.0.0",
    "httpx==0.28.1",
    "pillow==11.0.0",
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
    "slowapi==0.1.9"
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pip-audit==2.10.1"
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "alembic/versions"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["assignment", "union-attr", "arg-type", "attr-defined"]
exclude = ["venv", ".venv", "tests", "alembic"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers"
testpaths = ["backend/tests"]
pythonpath = ["..", "."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
